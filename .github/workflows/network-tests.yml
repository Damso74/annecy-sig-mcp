name: Network tests (manual)

# Workflow optionnel — déclenché à la main pour exécuter les tests qui touchent
# réellement le portail ArcGIS Annecy. Non activé en CI standard ni sur PR.
# La cible reste lecture seule (GET, allowlist, pas de POST), aucun secret requis.

on:
  workflow_dispatch:
  # Drift quotidien à 06:00 UTC (08:00 Paris en heure d'été) :
  # vérifie que le schéma ArcGIS Annecy n'a pas dérivé du registre commit.
  # En cas de drift, le job échoue → action manuelle : `npm run sync:registry`
  # localement puis commit du fichier généré.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  network:
    name: Tests réseau ArcGIS (RUN_NETWORK_TESTS=true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_NETWORK_TESTS: 'true'
      CONTRACT_POLICY: strict
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Drift detection live : si une couche ArcGIS a changé de schéma,
      # ce job échoue → relancer `npm run sync:registry` localement.
      - name: Vérifier l'alignement registre ↔ ArcGIS (live)
        run: npm run check:registry
